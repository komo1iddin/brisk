[package]
name = "zapfast-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Swift-facing bridge over ZapFast's backend for the native macOS app"

[lib]
name = "zapfast_bridge"
crate-type = ["staticlib", "lib"]

[dependencies]
# The upstream crate, used as a library, without its egui interface: its
# backend, archive, settings, themes and media decoding are the whole
# contract. `default-features = false` drops the views, the desktop shell
# and eframe with winit and glow behind them.
zapfast = { path = "../..", default-features = false }
uniffi = "0.32"
thiserror = "2"
log = "0.4"
# `Color32`, which upstream's palette and `wallpaper::doodle_ink` are written
# in. Nothing else here touches egui: the backend wakes us through a plain
# callback.
egui = { version = "0.36", default-features = false }
# The same logger upstream uses, with its protocol redaction.
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Reads the JSON palettes upstream and Spotifast share, as upstream does.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Upstream's emoji data, for its `:shortcode` completion.
emojis = "0.9"
# Calls. Upstream links whatsapp-rust without its VoIP stack; naming the same
# git revision here unifies the two, so the bridge adds the `voip` features
# (MLOW, libopus for peers that speak standard Opus, the UDP relay) without
# touching upstream's manifest. Keep the revision equal to upstream's.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", default-features = false, features = ["voip"] }
tokio = { version = "1", features = ["rt", "time"] }
# The call history's own store, encrypted as upstream's archive is: the
# same SQLCipher build and a key in the keychain.
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring-core = "1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
zeroize = "1"
getrandom = "0.4"
sha2 = "0.11"

[workspace]
members = [".", "uniffi-bindgen"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The binding generator is a build tool; without debug info it links quietly.
[profile.bindgen]
inherits = "dev"
debug = false

# Matches upstream: optimised dependencies keep decryption and history sync
# usable in debug builds. Their debug info would make the static library
# ~1.5 GB and every app link slow; the bridge itself keeps full debug info.
[profile.dev.package."*"]
opt-level = 2
debug = false

# BEGIN UPSTREAM PATCHES — managed by macos/Scripts/sync-patches.sh, do not edit.
[patch.crates-io]
# crmne/egui apps-0.36, shared with Spotifast, RekordFlash and TonePush: egui
# 0.36.1 with right-to-left shaping and glyph clusters from crmne/zapfast#144
# and digits shaped left to right in text without right-to-left letters (#184)
# (emilk/egui#8577), egui's busy-loop fix (emilk/egui#8398), and eframe pacing
# Wayland frames by the compositor's frame callbacks so a window the
# compositor stops showing never blocks in a vsync swap (emilk/egui#8631).
# Each emoji cluster (families, skin tones, keycaps, flags) lays out one emoji
# wide, and the Wayland clipboard shares winit's data device (see below).
# Focus on a widget without an accessibility node goes to the root
# (emilk/egui#8621, the group rename crash in #313), glow falls back to a
# compatibility-profile context on old Windows drivers (#349,
# emilk/egui#8655), and a saved window size keeps its zoom factor so a window
# no longer shrinks each time it reopens (#293, emilk/egui#8656).
# Every egui crate comes from the same revision so they share one emath and
# epaint. Drop this once egui releases all three.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests (winit#4692), and Windows drags between monitors of
# different scale (winit#4694). eframe from the fork above calls the Occluded
# API. File drops on Wayland (#178), with egui's clipboard on winit's one
# data device: Hyprland sends the clipboard only to a client's first data
# device, so a second one stopped pasting (crmne/spotifast#614). A dropped
# macOS window is ordered out before it closes, so a Touch Bar exception
# cannot leave it on screen (#260, rust-windowing/winit#4728).
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
# END UPSTREAM PATCHES
