# XcodeGen spec for the app target. `make project` turns this into
# ZapFast.xcodeproj, which is generated and not committed.
name: ZapFast

options:
  bundleIdPrefix: com.komoliddin
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing with a stable identity keeps the Keychain from asking again
    # after every build for the archive key.
    DEVELOPMENT_TEAM: 2DQJ3SL785
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ZapFastKit:
    path: Packages/ZapFastKit

targets:
  ZapFast:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Upstream's notification sounds (Pidgin's), read in place.
      - path: ../assets/sounds
        includes: ["*.wav"]
        buildPhase: resources
      # Upstream's doodle wallpaper tile (Lucide icons, ISC).
      - path: ../assets/wallpaper.svg
        buildPhase: resources
    dependencies:
      - package: ZapFastKit
        product: ZapFastShell
      # The Share menu's entry, embedded in Contents/PlugIns.
      - target: ZapFastShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ZapFast
        CFBundleName: ZapFast
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "15.0"
        # One copy per user: both would open the same archive.
        LSMultipleInstancesProhibited: true
        NSHumanReadableCopyright: "Native macOS interface for ZapFast (MIT) by Carmine Paolino and contributors."
        NSMicrophoneUsageDescription: "ZapFast records voice messages when you ask it to."
        # The Share extension hands what was shared to the app this way.
        CFBundleURLTypes:
          - CFBundleURLName: com.komoliddin.ZapFastMac.share
            CFBundleURLSchemes: [zapfast-mac]
    entitlements:
      path: App/ZapFast.entitlements
      properties:
        # Personal build, outside the App Store: no sandbox for now.
        com.apple.security.app-sandbox: false
        # Hardened runtime: recording voice messages.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komoliddin.ZapFastMac
        PRODUCT_NAME: ZapFast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ZapFastShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements", "Info.plist"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ZapFast
        CFBundleName: ZapFast
        LSMinimumSystemVersion: "15.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 30
              NSExtensionActivationSupportsImageWithMaxCount: 30
              NSExtensionActivationSupportsMovieWithMaxCount: 30
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ZapFastShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komoliddin.ZapFastMac.Share
        PRODUCT_NAME: ZapFastShare

schemes:
  ZapFast:
    build:
      targets:
        ZapFast: all
      # Runs before any package target builds, so the xcframework and the
      # generated Swift are current. `make bridge` does the same by hand.
      preActions:
        - name: Build Rust bridge
          settingsTarget: ZapFast
          script: |
            "$SRCROOT/Scripts/build-bridge.sh" "$CONFIGURATION" > "$SRCROOT/Build/bridge-build.log" 2>&1 \
              || { echo "Rust bridge build failed, see Build/bridge-build.log" >&2; exit 1; }
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ZapFastKit/ZapFastCoreTests
    archive:
      config: Release
