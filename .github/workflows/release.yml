name: Native macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Native release source and license review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a release commit already on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - name: Match tag to the native version
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          version = re.search(r'^\s*MARKETING_VERSION:\s*"([^"]+)"', Path('macos/project.yml').read_text(), re.M)[1]
          tag = re.fullmatch(r'v(\d+\.\d+\.\d+)(?:-(?:alpha|beta|rc)\.\d+)?', os.environ['GITHUB_REF_NAME'])
          if not tag or tag[1] != version:
              raise SystemExit('Release tag must match the native MARKETING_VERSION.')
          PYCODE
      - name: Require reviewed native release notes
        run: test -s "macos/release-notes/${GITHUB_REF_NAME}.md"
      - name: Require resolved license review for the locked dependencies
        run: python3 macos/Scripts/check-release-license.py

  build:
    needs: source
    uses: ./.github/workflows/native-macos.yml
    with:
      package: true

  package:
    name: Sign, notarize and prepare native draft release
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    environment: native-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: native-unsigned
          path: macos/Build
      - name: Sign and notarize native app
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -x -k macos/Build/native-unsigned.zip macos/Build/release
          bash macos/Scripts/sign-native.sh "$PWD/macos/Build/release/ZapFast.app" "$PWD/macos/Build/ZapFast-native-macos-universal-${GITHUB_REF_NAME}.zip"
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd macos/Build
          zip="ZapFast-native-macos-universal-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "$zip" > checksums.txt
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$zip" checksums.txt --verify-tag --draft "${flags[@]}" --title "ZapFast native macOS $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/macos/release-notes/${GITHUB_REF_NAME}.md"
